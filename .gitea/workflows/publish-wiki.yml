# Publish the project's wiki pages to the git host's wiki.
#
# Purpose:  copy the Markdown pages of docs/wiki/ (English, Danish, Bahasa
#           Malaysia) to the wiki of this repository (framework/process/wiki.md).
# Triggers: a push to main that changes docs/wiki/. There is no manual run,
#           because the reusable workflow has no dry-run input.
# Inputs:   wiki_dir (docs/wiki) and prune ("true": wiki pages that are not in
#           the folder are deleted, so the wiki always equals the folder).
# Secrets:  TOKEN_FOR_GITEA_WIKI, an organization secret: a Gitea token with
#           scope write:repository for a user that can write this repository.
#           Create it before the first run; until then the run fails.
# Changes outside the repository: the wiki of this repository. A runner must
#           be registered for the repository or its organization, and the
#           wiki must be enabled in the repository settings.
# Decision: MIL-003 task 6 (docs/milestones/mil-003-documentation-release.md).
# Source:   framework/templates/ci/publish-wiki.yml, with permissions and
#           concurrency added. The reusable workflow and its script are pinned
#           to the exact release tag v1.2.2 of TirSystem/github-action.
# Host:     Gitea (the reusable workflow uses gitea.* contexts), not GitHub
#           Actions. Not yet run on the instance: see RC-016.

name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: Publish docs/wiki to the repository wiki
    permissions:
      contents: read
    uses: TirSystem/github-action/.gitea/workflows/publish-wiki-pages.yml@v1.2.2
    with:
      wiki_dir: docs/wiki
      prune: "true"
      tools-ref: v1.2.2
    secrets:
      TOKEN_FOR_GITEA_WIKI: ${{ secrets.TOKEN_FOR_GITEA_WIKI }}
